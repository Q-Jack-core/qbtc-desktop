[package]
name = "app"
version = "1.2.5"
description = "Q-BTC Post-Quantum Self-Custody Vault & Full Node"
authors = ["Q-BTC Core Contributors"]
license = "MIT"
repository = "https://github.com/Q-Jack-core/qbtc-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-shell = "2.3.6"